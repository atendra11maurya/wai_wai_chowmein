backend:
  name: git-gateway
  branch: main

# Local development mode fallback (Uncomment during local testing without Netlify Identity)
# local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "portfolio_config"
    label: "Portfolio Settings"
    delete: false
    editor:
      preview: false
    files:
      - file: "src/config/portfolioData.json"
        label: "Portfolio Information & Data"
        name: "portfolio_data"
        fields:
          - label: "Personal & Contact Information"
            name: "personal"
            widget: "object"
            fields:
              - { label: "Full Name", name: "name", widget: "string" }
              - { label: "Short Name (for Navbar)", name: "shortName", widget: "string" }
              - { label: "Avatar Initials", name: "avatarInitials", widget: "string" }
              - { label: "Avatar Image", name: "avatarImage", widget: "image", default: "/abhijeet_avatar.png" }
              - { label: "Title & Tagline", name: "title", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Email Address", name: "email", widget: "string" }
              - { label: "WhatsApp Number (with country code, e.g. 919876543210)", name: "whatsappNumber", widget: "string" }
              - { label: "WhatsApp Default Message", name: "whatsappMessage", widget: "string" }
              - { label: "LinkedIn URL", name: "linkedin", widget: "string" }
              - { label: "GitHub URL", name: "github", widget: "string" }
              - { label: "Resume PDF File", name: "resumeUrl", widget: "file" }
              - { label: "Summary / Bio", name: "summary", widget: "text" }

          - label: "Impact Metrics & Statistics"
            name: "impactMetrics"
            widget: "list"
            fields:
              - { label: "Metric Value (e.g. 12+)", name: "value", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Subtext", name: "subtext", widget: "string" }

          - label: "Top Skills List"
            name: "topSkills"
            widget: "list"

          - label: "Top Achievements (Landing Page Highlight)"
            name: "topAchievements"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Badge Tag", name: "badge", widget: "string" }
              - { label: "Icon Emoji", name: "icon", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Button Action Text", name: "actionText", widget: "string" }

          - label: "Testimonials & Recommendations"
            name: "testimonials"
            widget: "list"
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Author Name", name: "author", widget: "string" }
              - { label: "Title / Role", name: "title", widget: "string" }
              - { label: "Avatar Emoji/Icon", name: "avatar", widget: "string" }

          - label: "Certifications"
            name: "certifications"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Issuer", name: "issuer", widget: "string" }
              - { label: "Icon Emoji", name: "icon", widget: "string" }
              - { label: "Badge Tag", name: "badge", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }

          - label: "Work & Research Experiences"
            name: "experiences"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "number" }
              - { label: "Role Title", name: "role", widget: "string" }
              - { label: "Company / Institution", name: "company", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Period", name: "period", widget: "string" }
              - { label: "Category (work / ai / research / leadership)", name: "category", widget: "string" }
              - { label: "Icon Emoji", name: "icon", widget: "string" }
              - { label: "Key Responsibility Bullets", name: "details", widget: "list" }
              - { label: "Tags", name: "tags", widget: "list" }

          - label: "Education"
            name: "education"
            widget: "list"
            fields:
              - { label: "Badge Tag", name: "badge", widget: "string" }
              - { label: "Degree Title", name: "degree", widget: "string" }
              - { label: "Field of Study", name: "field", widget: "string" }
              - { label: "Institution Name", name: "institution", widget: "string" }
              - { label: "Period", name: "period", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }

          - label: "Projects"
            name: "projects"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Icon Emoji", name: "icon", widget: "string" }
              - { label: "Badge Tag", name: "badge", widget: "string" }
              - { label: "Live Demo URL", name: "liveUrl", widget: "string", required: false }
              - { label: "GitHub Source URL", name: "githubUrl", widget: "string", required: false }
